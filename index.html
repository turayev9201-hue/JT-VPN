<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JT VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 20px; background-color: var(--tg-theme-bg-color, #1c1c1e); color: var(--tg-theme-text-color, #ffffff); display: flex; flex-direction: column; align-items: center; height: 100vh; overflow-y: auto; }
        .header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .header p { margin: 5px 0 0; color: #8e8e93; font-size: 14px; }
        .status-badge { background-color: rgba(255, 59, 48, 0.2); color: #ff3b30; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 30px; }
        .status-badge.connected { background-color: rgba(52, 199, 89, 0.2); color: #34c759; }
        
        .vpn-btn-container { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
        .vpn-btn { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(145deg, #2c2c2e, #1c1c1e); box-shadow: 10px 10px 20px #121212, -10px -10px 20px #262628; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: none; color: white; outline: none; transition: all 0.3s; }
        .vpn-btn:active { transform: scale(0.95); }
        .vpn-btn svg { width: 60px; height: 60px; margin-bottom: 10px; fill: #ff3b30; transition: fill 0.3s; }
        .vpn-btn.active svg { fill: #34c759; }
        .vpn-btn span { font-size: 18px; font-weight: 600; }

        .action-container { width: 100%; max-width: 400px; display: none; flex-direction: column; }
        .action-btn { display: block; width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 16px; text-align: center; font-weight: 600; font-size: 18px; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background-color: #34c759; color: white; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4); }
        
        .guide-box { background-color: #2c2c2e; padding: 20px; border-radius: 16px; margin-top: 20px; text-align: left; }
        .guide-box h3 { margin-top: 0; color: #fff; font-size: 16px; margin-bottom: 15px; }
        .guide-step { display: flex; margin-bottom: 15px; align-items: flex-start; }
        .step-num { background-color: #34c759; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 10px; flex-shrink: 0; font-size: 13px; }
        .step-text { font-size: 14px; line-height: 1.4; color: #e5e5ea; }
    </style>
</head>
<body>

    <div class="header">
        <h1>JT VPN</h1>
        <p id="userName">Yuklanmoqda...</p>
    </div>

    <div class="status-badge" id="statusBadge">Ulanmagan</div>

    <div class="vpn-btn-container" id="btnContainer">
        <button class="vpn-btn" id="mainBtn">
            <svg viewBox="0 0 24 24"><path d="M16.56 5.44l-1.45 1.45A8 8 0 1 1 12 20a8.01 8.01 0 0 1-6.61-3.55l-1.45 1.45A9.95 9.95 0 0 0 12 22c5.52 0 10-4.48 10-10 0-2.45-.88-4.71-2.35-6.46l-1.09-.1zM11 2h2v10h-2V2z"/></svg>
            <span id="btnText">Ulash</span>
        </button>
    </div>

    <div id="actionContainer" class="action-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API_URL = "https://136.244.110.2.nip.io/api";
        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : null;
        
        if (user) { document.getElementById("userName").innerText = user.first_name; }

        const mainBtn = document.getElementById("mainBtn");
        const btnText = document.getElementById("btnText");
        const statusBadge = document.getElementById("statusBadge");
        const btnContainer = document.getElementById("btnContainer");
        const actionContainer = document.getElementById("actionContainer");

        mainBtn.addEventListener("click", async () => {
            if (!userId) return;
            btnText.innerText = "Kutilmoqda...";
            tg.HapticFeedback.impactOccurred("medium");

            try {
                const res = await fetch(`${API_URL}/connect/${userId}`, { method: "POST" });
                if (!res.ok) throw new Error();
                const data = await res.json();

                if (data.status === "success") {
                    btnText.innerText = "Tayyor";
                    mainBtn.classList.add("active");
                    statusBadge.innerText = "Kalit yaratildi";
                    statusBadge.classList.add("connected");
                    
                    btnContainer.style.display = "none";
                    actionContainer.style.display = "flex";
                    
                    // Matnni avtomatik nusxalash
                    navigator.clipboard.writeText(data.config).catch(e => console.log(e));
                    
                    actionContainer.innerHTML = `
                        <button id="openWgBtn" class="action-btn btn-primary">
                            🚀 WireGuard'ni ochish
                        </button>
                        
                        <div class="guide-box">
                            <h3>Endi nima qilish kerak?</h3>
                            <div class="guide-step">
                                <div class="step-num">1</div>
                                <div class="step-text">Tepadagi <b>"WireGuard'ni ochish"</b> tugmasini bosing.</div>
                            </div>
                            <div class="guide-step">
                                <div class="step-num">2</div>
                                <div class="step-text">Dastur ochilgach, o'ng yuqoridagi <b>"+"</b> belgisini bosing.</div>
                            </div>
                            <div class="guide-step">
                                <div class="step-num">3</div>
                                <div class="step-text"><b>"Clipboard'dan yaratish" (Create from clipboard)</b> ni tanlang.</div>
                            </div>
                            <div class="guide-step">
                                <div class="step-num">4</div>
                                <div class="step-text">Ulanishni yoqing (yashil rang). VPN tayyor!</div>
                            </div>
                        </div>
                    `;

                    // WireGuard dasturini ochish
                    document.getElementById("openWgBtn").addEventListener("click", () => {
                        // iOS va Android uchun WireGuard URL scheme
                        window.location.href = "wireguard://";
                    });

                } else {
                    btnText.innerText = "Ulash";
                    tg.showAlert("Xatolik yuz berdi.");
                }
            } catch (e) {
                btnText.innerText = "Ulash";
                tg.showAlert("Server bilan aloqa uzildi.");
            }
        });
    </script>
</body>
</html>
